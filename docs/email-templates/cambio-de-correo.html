<div
  style="
    background: #f5f4f0;
    padding: 32px 16px;
    font-family: Arial, Helvetica, sans-serif;
    color: #252a2b;
  "
>
  <div
    style="
      max-width: 480px;
      margin: 0 auto;
      background: #ffffff;
      border-radius: 12px;
      padding: 32px;
      border-top: 4px solid #9e3030;
    "
  >
    <p
      style="
        margin: 0 0 4px;
        font-size: 13px;
        letter-spacing: 1px;
        text-transform: uppercase;
        color: #708b89;
      "
    >
      Ciudad de Avivamiento
    </p>
    <h1 style="margin: 0 0 16px; font-size: 22px; color: #252a2b">Confirma tu nuevo correo</h1>
    <p style="margin: 0 0 24px; font-size: 15px; line-height: 1.5">
      Pediste cambiar el correo de tu cuenta a {{ .NewEmail }}. Toca el botón para confirmarlo.
    </p>
    <p style="margin: 0 0 24px">
      <a
        href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=email_change"
        style="
          display: inline-block;
          background: #9e3030;
          color: #ffffff;
          text-decoration: none;
          padding: 12px 24px;
          border-radius: 8px;
          font-weight: bold;
          font-size: 15px;
        "
        >Confirmar cambio</a
      >
    </p>
    <p style="margin: 0; font-size: 13px; line-height: 1.5; color: #708b89">
      Si no pediste este cambio, ignora este correo y avisa a la administración de la iglesia.
    </p>
  </div>
</div>
